# pnpm workspace configuration.
#
# `allowBuilds` is an explicit allowlist: pnpm 11 refuses to run postinstall
# scripts for anything not listed here, which protects against supply-chain
# scripts in transitive packages. Every entry must be listed with a boolean —
# an omitted package stays blocked.
#
# A new transitive dependency with a postinstall script breaks `pnpm install`
# with ERR_PNPM_IGNORED_BUILDS. That failure is deliberate: it forces a decision
# about running someone else's install script rather than doing it silently.
#
# Why these are needed:
#   esbuild      downloads/links its platform binary in postinstall; without it
#                tsx and Vite's bundler cannot run
#   protobufjs   generates its runtime bundle in postinstall (transitive)
#   core-js      peer of canvg, which jsPDF pulls in as an optional dependency
#                for SVG rendering; its postinstall only prints a funding notice
#                and is required for pnpm to accept the install
allowBuilds:
  esbuild: true
  protobufjs: true
  core-js: true
