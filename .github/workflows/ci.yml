name: Quality Gates & Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, Audit, Domain Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # `npm ci`, not `npm install`: it installs exactly what package-lock.json
      # pins and fails if the lockfile and package.json disagree. The fallback to
      # `npm install` was removed on purpose — it silently resolved fresh
      # versions whenever the lockfile was missing, which is how a release could
      # change without a commit.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high

      - name: TypeScript static check
        run: npm run lint

      - name: Run DDD, security, and API tests
        run: npm test

      - name: Production bundle build
        run: npm run build

  integration:
    name: PostgreSQL Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rca
          POSTGRES_PASSWORD: integration-only-password
          POSTGRES_DB: rca_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rca -d rca_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run PostgreSQL integration suite
        env:
          TEST_DATABASE_URL: postgres://rca:integration-only-password@localhost:5432/rca_integration
        run: node --test tests/postgres-integration.test.ts

  docker:
    name: Container Image Smoke Build
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production Docker image
        run: docker build --file Dockerfile --tag rca-vostok:ci .
